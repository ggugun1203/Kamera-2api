name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Buat APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Mengunduh gradle-wrapper.jar resmi..."
            curl -sSL -f -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Ensure Debug Keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Membuat debug.keystore otomatis..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kamera-Pro-Note-9-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

